<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1С Академия</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><meta name="theme-color" content="#ffdc43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="1С Академия"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#242424;background:#f7f7f3}*{box-sizing:border-box}body{margin:0}header{background:#ffdc43;padding:24px max(20px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:27px;margin:0}h2{margin:0 0 12px}h3{margin:20px 0 8px}p{line-height:1.65}main{max-width:1120px;margin:26px auto;padding:0 16px}.layout{display:grid;grid-template-columns:265px 1fr;gap:20px}.panel{background:white;border:1px solid #e9e7dd;border-radius:18px;padding:24px;box-shadow:0 5px 24px #22222207}.side button{display:block;width:100%;margin:8px 0;text-align:left}.btn,button{font:inherit;border:0;border-radius:11px;padding:11px 15px;background:#272727;color:white;cursor:pointer}.subtle{background:#f3f2ed;color:#222}.selected{background:#ffdc43;color:#222}.muted{color:#6c6c6c;font-size:14px}.pill{background:#fff0a8;border-radius:20px;padding:7px 12px;font-size:13px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #ececec}.item:last-child{border-bottom:0}.item strong{display:block}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}input,textarea{font:inherit;width:100%;border:1px solid #d7d7d7;border-radius:9px;padding:11px;margin:7px 0 14px}textarea{min-height:140px}label{display:block;font-weight:600;margin-top:12px}.lessonbody{white-space:pre-wrap;line-height:1.8;background:#faf9f4;border-radius:13px;padding:20px;margin:18px 0}.option{display:block;text-align:left;width:100%;margin:8px 0;background:#f3f2ed;color:#222}.right{background:#d9f4db}.wrong{background:#ffdddd}progress{width:100%;height:13px;accent-color:#d4aa00}.notice{background:#fff5c9;border-radius:12px;padding:13px}.stat{font-size:30px;font-weight:750}footer{margin:25px auto;max-width:1120px;padding:0 18px;color:#777;font-size:13px}@media(max-width:750px){.layout{grid-template-columns:1fr}header{padding:20px}.panel{padding:18px}.item{align-items:flex-start}}
</style></head><body><header><div><h1>📚 1С Академия</h1><div>Бесплатная платформа для изучения 1С</div></div><span class="pill">Бесплатно · Без регистрации</span></header><main><div class="layout"><aside class="panel side"><h2>Курсы</h2><div id="menu"></div><button class="subtle" onclick="newCourse()">＋ Создать курс</button><hr><p class="muted">Общий прогресс</p><progress id="progress" max="100" value="0"></progress><p id="progressLabel" class="muted"></p><div class="toolbar"><button class="subtle" onclick="exportBackup()">↓ Экспорт</button><label style="font-size:13px;font-weight:400;cursor:pointer">↑ Импорт<input type="file" accept=".json" onchange="importBackup(event)"></label></div></aside><section id="content" class="panel"></section></div></main><footer>Прогресс и созданные материалы сохраняются только в этом браузере. Для переноса на другое устройство используй экспорт и импорт JSON.</footer><script>
const seed=[{id:"basics",title:"Основы 1С",description:"Платформа, конфигурации и режимы работы",lessons:[{id:"intro",title:"Что такое 1С:Предприятие",body:"1С:Предприятие — платформа, на основе которой создают прикладные решения для автоматизации бизнеса.\n\nНапример, компания может использовать программу для учёта продаж, товаров, зарплаты или бухгалтерии.\n\nВажно: 1С — не одна программа для всех задач. Есть платформа и разные прикладные решения, которые называют конфигурациями.\n\nПримеры: «1С:Бухгалтерия», «1С:Зарплата и управление персоналом» (ЗУП), «1С:Управление торговлей».",question:"Что такое платформа 1С:Предприятие?",answers:["Основа для работы прикладных решений","Только бухгалтерский отчёт","Название одной таблицы"],correct:0},{id:"config",title:"Платформа и конфигурация",body:"Платформа обеспечивает общие механизмы работы: хранение данных, выполнение прикладной логики, формы и взаимодействие с пользователем.\n\nКонфигурация определяет, какие объекты и бизнес-процессы реализованы в конкретной информационной системе.\n\nПредставь: платформа — фундамент и инструменты, конфигурация — построенное с их помощью приложение.\n\nОбновления платформы и конфигурации — не одно и то же. При работе с реальной базой всегда учитывай совместимость версий и резервные копии.",question:"Что определяет конфигурация?",answers:["Физическую модель компьютера","Прикладные объекты и процессы","Скорость интернета"],correct:1},{id:"modes",title:"Режимы работы в 1С",body:"Режим «1С:Предприятие» предназначен для обычной работы пользователя: создания документов, заполнения справочников, просмотра отчётов.\n\n«Конфигуратор» используют для разработки и администрирования информационной базы. Доступ к нему зависит от прав пользователя.\n\nВ типовом сценарии бухгалтер работает в режиме «1С:Предприятие», а разработчик или администратор может использовать Конфигуратор.",question:"Где пользователь обычно вводит документы?",answers:["В Конфигураторе","В режиме «1С:Предприятие»","В редакторе фотографий"],correct:1},{id:"objects",title:"Справочники и документы",body:"Справочники хранят относительно постоянные сведения: номенклатуру, контрагентов, сотрудников и другие объекты.\n\nДокументы отражают хозяйственные события или операции: поступление товаров, реализацию, начисление и т. д.\n\nВ конкретной конфигурации состав объектов и их поведение могут отличаться.\n\nПрактика: придумай три примера данных для справочника и три примера событий, которые могли бы оформляться документами.",question:"Что чаще относится к справочнику?",answers:["Список контрагентов","Факт продажи товара","Начисление за месяц"],correct:0}]},{id:"account",title:"1С:Бухгалтерия",description:"План обучения: учёт, документы, отчётность",lessons:[]},{id:"zup",title:"1С:ЗУП",description:"План обучения: кадры и зарплата",lessons:[]},{id:"dev",title:"Разработка 1С",description:"План обучения: метаданные, формы, запросы",lessons:[]}];
const KEY="polisha-academy-v2";let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.courses))data={courses:seed,done:{},notes:{}};let active=data.courses[0]?.id;const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const uid=()=>("u"+Date.now()+Math.random().toString(36).slice(2));const course=()=>data.courses.find(c=>c.id===active);function persist(){localStorage.setItem(KEY,JSON.stringify(data));nav()}function nav(){ $("menu").innerHTML=data.courses.map(c=>'<button class="'+(c.id===active?"selected":"subtle")+'" onclick="openCourse(\''+c.id+'\')">'+esc(c.title)+'</button>').join("");let all=data.courses.flatMap(c=>c.lessons),count=all.filter(l=>data.done[l.id]).length,p=all.length?Math.round(count/all.length*100):0;$("progress").value=p;$("progressLabel").textContent=count+" из "+all.length+" уроков · "+p+"%"}function openCourse(id){active=id;nav();showCourse()}function showCourse(){let c=course();$("content").innerHTML='<h2>'+esc(c.title)+'</h2><p class="muted">'+esc(c.description)+'</p>'+(c.lessons.length?c.lessons.map((l,i)=>'<div class="item"><div><strong>'+(data.done[l.id]?"✅ ":"○ ")+(i+1)+'. '+esc(l.title)+'</strong><span class="muted">'+(data.done[l.id]?"Пройден":"Не пройден")+'</span></div><button onclick="showLesson(\''+l.id+'\')">Открыть</button></div>').join(""):'<p class="notice">Пока здесь нет уроков. Можно добавить собственный материал — или дождаться новых уроков Академии.</p>')+'<div class="toolbar"><button onclick="editLesson()">＋ Новый урок</button><button class="subtle" onclick="editCourse()">Изменить курс</button></div>'}function showLesson(id){let l=course().lessons.find(x=>x.id===id);if(!l)return;let quiz=l.question?'<h3>Проверь себя</h3><p>'+esc(l.question)+'</p>'+l.answers.map((a,i)=>'<button class="option" onclick="answer(\''+id+'\','+i+')">'+esc(a)+'</button>').join("")+'<p id="result"></p>':"";$("content").innerHTML='<button class="subtle" onclick="showCourse()">← К списку уроков</button><h2 style="margin-top:20px">'+esc(l.title)+'</h2><div class="lessonbody">'+esc(l.body)+'</div>'+quiz+'<h3>Мои заметки</h3><textarea id="notes" placeholder="Записывай мысли и примеры...">'+esc(data.notes[id]||"")+'</textarea><div class="toolbar"><button onclick="saveNotes(\''+id+'\')">Сохранить заметки</button><button onclick="markDone(\''+id+'\')">'+(data.done[id]?"✓ Урок пройден":"Отметить пройденным")+'</button><button class="subtle" onclick="editLesson(\''+id+'\')">Редактировать урок</button></div>'}function answer(id,i){let l=course().lessons.find(x=>x.id===id);document.querySelectorAll(".option").forEach((b,j)=>{b.disabled=true;if(j===l.correct)b.classList.add("right");else if(j===i)b.classList.add("wrong")});$("result").textContent=i===l.correct?"Верно! 🎉":"Не совсем. Правильный вариант подсвечен зелёным."}function saveNotes(id){data.notes[id]=$("notes").value;persist();alert("Заметки сохранены")}function markDone(id){data.done[id]=true;persist();showLesson(id)}function newCourse(){editCourse(true)}function editCourse(isNew=false){let c=isNew?{title:"",description:""}:course();$("content").innerHTML='<h2>'+(isNew?"Новый курс":"Редактирование курса")+'</h2><label>Название<input id="courseTitle" value="'+esc(c.title)+'"></label><label>Описание<textarea id="courseDesc">'+esc(c.description)+'</textarea></label><div class="toolbar"><button onclick="saveCourse('+isNew+')">Сохранить</button><button class="subtle" onclick="showCourse()">Отмена</button></div>'}function saveCourse(isNew){let t=$("courseTitle").value.trim();if(!t)return alert("Введите название");if(isNew){let c={id:uid(),title:t,description:$("courseDesc").value,lessons:[]};data.courses.push(c);active=c.id}else{course().title=t;course().description=$("courseDesc").value}persist();showCourse()}function editLesson(id){let l=id?course().lessons.find(x=>x.id===id):null;$("content").innerHTML='<h2>'+(l?"Редактировать урок":"Новый урок")+'</h2><label>Название<input id="lessonTitle" value="'+esc(l?.title||"")+'"></label><label>Материал урока<textarea id="lessonBody" style="min-height:220px">'+esc(l?.body||"")+'</textarea></label><label>Вопрос теста (необязательно)<input id="question" value="'+esc(l?.question||"")+'"></label><label>Варианты ответов (по одному на строку)<textarea id="answers">'+esc((l?.answers||[]).join("\n"))+'</textarea></label><label>Номер правильного ответа (начиная с 1)<input type="number" min="1" id="correct" value="'+((l?.correct??0)+1)+'"></label><div class="toolbar"><button onclick="saveLesson('+JSON.stringify(id||null)+')">Сохранить урок</button><button class="subtle" onclick="showCourse()">Отмена</button></div>'}function saveLesson(id){let title=$("lessonTitle").value.trim(),question=$("question").value.trim(),answers=$("answers").value.split("\n").map(s=>s.trim()).filter(Boolean),correct=Number($("correct").value)-1;if(!title)return alert("Введите название");if(question&&(!answers.length||correct<0||correct>=answers.length))return alert("Проверьте ответы и номер правильного ответа");let l={id:id||uid(),title,body:$("lessonBody").value,question,answers:question?answers:[],correct:question?correct:0};if(id)Object.assign(course().lessons.find(x=>x.id===id),l);else course().lessons.push(l);persist();showLesson(l.id)}function exportBackup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="1c-academy-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}function importBackup(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.courses)||!d.courses.length||!d.done||typeof d.done!=="object")throw Error("invalid");if(!confirm("Заменить текущие курсы и прогресс импортированными?"))return;data={courses:d.courses,done:d.done,notes:d.notes||{}};active=data.courses[0].id;persist();showCourse()}catch{alert("Не удалось импортировать файл")}};reader.readAsText(f)}nav();showCourse();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script></body></html>
